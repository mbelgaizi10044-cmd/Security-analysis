<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>ACIS Security Analysis</title>

<style>
/* Layout: official letterhead plate over a dark operations console — map + intelligence column; country file in the column (full sheet on phones); briefings as a read-only report. */
:root{
  --bg:#0D1218; --panel:#131A22; --panel-2:#19222C; --line:#26313D; --line-2:#334150;
  --fg:#E4E9EE; --muted:#8C98A5; --faint:#5F6B78;
  --accent:#3E9B6E; --accent-soft:rgba(62,155,110,.14); --accent-ink:#06120C;
  --gold:#C8A24A; --gold-soft:rgba(200,162,74,.14);
  --plate:#F3F0EA; --plate-line:#DDD7CC;
  --land:#202B36; --land-hover:#2C3A48; --land-line:#0D1218; --sea:#10171E;
  --sev-critical:#E5484D; --sev-high:#EE8434; --sev-medium:#D4AE3A; --sev-low:#5C8FD6;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
:root[data-ui="light"]{
  --bg:#F2F4F5; --panel:#FFFFFF; --panel-2:#EDF0F2; --line:#D8DEE3; --line-2:#C5CDD4;
  --fg:#15202A; --muted:#566370; --faint:#8794A0;
  --accent:#1E7A4F; --accent-soft:rgba(30,122,79,.10); --accent-ink:#FFFFFF;
  --gold:#8F6E1E; --gold-soft:rgba(143,110,30,.10);
  --land:#D3DAE0; --land-hover:#BCC6CF; --land-line:#FFFFFF; --sea:#F7F9FA;
  --sev-critical:#C9343A; --sev-high:#CF6A1C; --sev-medium:#A9850F; --sev-low:#3B6FB8;
  --shadow:0 18px 50px rgba(20,32,42,.18);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

.plate{background:transparent}
:root[data-ui="light"] .plate img{filter:brightness(0);opacity:.86}
.plate .wrap{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:10px}
.plate img{display:block;height:46px;width:auto;max-width:none;object-fit:contain}
.plate .right{display:flex;align-items:center;gap:22px}
.plate .acis{height:36px}
.plate .gov{height:56px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.bar .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brandwrap{display:flex;align-items:center;gap:12px;min-width:0}
.appicon{width:42px;height:42px;border-radius:10px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35);display:block}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chipbtn:hover{border-color:var(--line-2)}
.chipbtn svg{width:15px;height:15px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ai{background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent)}
.btn.danger{background:var(--sev-critical);color:#fff}
.btn svg{width:16px;height:16px;flex:none}
.owner-only{display:none!important}
body.is-owner .owner-only{display:inline-flex!important}
body.is-owner .owner-block{display:block!important}
.owner-block{display:none!important}
.notice{margin-bottom:14px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}

main{padding-block:18px 40px}

.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(330px,1fr);gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.stack{display:grid;gap:16px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700}
.panel-h .sub{color:var(--muted);font-size:12px}
.panel-h .end{margin-inline-start:auto}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0}

.mapbox{position:relative;background:var(--sea);border-radius:0 0 var(--r) var(--r);overflow:hidden;touch-action:none;aspect-ratio:900/440;max-width:100%}
#map{display:block;width:100%;height:100%;cursor:grab;user-select:none}
#map.dragging{cursor:grabbing}
#map path{fill:var(--land);stroke:var(--land-line);stroke-width:.5;vector-effect:non-scaling-stroke;transition:fill .15s}
#map path:hover{fill:var(--land-hover)}
#map path.sev-low{fill:color-mix(in srgb,var(--sev-low) 55%,var(--land))}
#map path.sev-medium{fill:color-mix(in srgb,var(--sev-medium) 60%,var(--land))}
#map path.sev-high{fill:color-mix(in srgb,var(--sev-high) 68%,var(--land))}
#map path.sev-critical{fill:var(--sev-critical)}
#map path.sel{stroke:var(--fg);stroke-width:1.6}
#map path.uae{stroke:var(--gold);stroke-width:1.4}
.zoom{position:absolute;inset-inline-end:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:16px;line-height:1}
.legend{position:absolute;inset-inline-start:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--muted);max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-130%);display:none}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.offmap{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);align-items:center}

.search{position:relative;padding:12px 14px}
.search input{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;padding-inline-start:36px}
.search svg{position:absolute;top:50%;inset-inline-start:26px;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;inset-inline:14px;top:calc(100% - 6px);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:15}
.results button,.combo-list button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:9px 12px;text-align:start}
.results button:hover,.results button.hl,.combo-list button:hover,.combo-list button.hl{background:var(--panel-2)}
.results .n{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.flag{font-size:18px;line-height:1;width:24px;text-align:center;flex:none}

.board{list-style:none;margin:0;padding:0}
.board li+li{border-top:1px solid var(--line)}
.board button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 14px;text-align:start}
.board button:hover{background:var(--panel-2)}
.board .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .rt{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex:none}

.feed{list-style:none;margin:0;padding:0}
.feed li+li{border-top:1px solid var(--line)}
.feed button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;width:100%;border:0;background:none;padding:11px 14px;text-align:start}
.feed button:hover{background:var(--panel-2)}
.feed .meta{grid-column:2;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.feed .hd{grid-column:2;font-weight:600;line-height:1.4}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-weight:500;margin-bottom:4px}

.sev{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;line-height:1.5}
.sev::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sev.critical{color:var(--sev-critical)} .sev.high{color:var(--sev-high)} .sev.medium{color:var(--sev-medium)} .sev.low{color:var(--sev-low)}
.sev.none{color:var(--faint)}
.sev.solid{color:#fff;border-color:transparent}
.sev.solid.critical{background:var(--sev-critical)}.sev.solid.high{background:var(--sev-high)}.sev.solid.medium{background:var(--sev-medium);color:#15202A}.sev.solid.low{background:var(--sev-low)}
.sev.solid::before{background:currentColor;opacity:.85}
.cat{display:inline-flex;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dxb{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--gold-soft);color:var(--gold);white-space:nowrap}
.dxb svg{width:12px;height:12px}
.trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;white-space:nowrap}
.trend.up{color:var(--sev-critical)} .trend.down{color:var(--accent)} .trend.steady{color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:7px}
.dot.critical{background:var(--sev-critical)}.dot.high{background:var(--sev-high)}.dot.medium{background:var(--sev-medium)}.dot.low{background:var(--sev-low)}

#side{position:sticky;top:76px}
.cfile-h{padding:14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.cfile-h .big{font-size:30px;line-height:1}
.cfile-h h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.3}
.cfile-h .alt{color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:16px;height:16px}
.threat{margin:12px 14px 0;border:1px solid var(--line);border-radius:8px;padding:11px 12px;display:grid;gap:6px;background:var(--panel-2)}
.threat .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.threat .note{font-size:13.5px;color:color-mix(in srgb,var(--fg) 85%,var(--muted));white-space:pre-wrap}
.threat .upd{font-size:11.5px;color:var(--faint)}
.threat .edit{margin-inline-start:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fchip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.fchip[aria-pressed="true"]{color:var(--bg);border-color:transparent}
.fchip.critical[aria-pressed="true"]{background:var(--sev-critical)}.fchip.high[aria-pressed="true"]{background:var(--sev-high)}.fchip.medium[aria-pressed="true"]{background:var(--sev-medium)}.fchip.low[aria-pressed="true"]{background:var(--sev-low)}
.fchip.gold[aria-pressed="true"]{background:var(--gold);color:#15202A}
.fsel{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted);max-width:100%}
.dates{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);width:100%}
.dates input{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px 6px;font-size:12px;min-width:0;flex:1}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:2px 4px}
.items{max-height:calc(100vh - 380px);overflow:auto}

.item{padding:14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .meta{display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px;color:var(--muted)}
.item h3{margin:7px 0 4px;font-size:15.5px;font-weight:600;line-height:1.45}
.item .body{white-space:pre-wrap;color:color-mix(in srgb,var(--fg) 86%,var(--muted));font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.item.open .body{display:block}
.item .dnote{margin-top:6px;font-size:13px;color:var(--gold);display:flex;gap:6px}
.item .more{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:4px 0}
.item details{margin-top:6px;font-size:13px}
.item details summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:12.5px}
.item details div{white-space:pre-wrap;margin-top:6px;padding:10px;border-radius:6px;background:var(--panel-2);color:var(--muted);max-height:320px;overflow:auto;overflow-wrap:anywhere}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{width:84px;height:64px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);cursor:zoom-in;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.pdf{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:12.5px;background:var(--panel-2);max-width:100%;color:var(--fg);text-decoration:none}
.pdf svg{width:16px;height:16px;color:var(--sev-critical);flex:none}
.pdf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.item .acts{display:flex;gap:6px;margin-top:8px}
.item .acts button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 10px;font-size:12px;color:var(--muted)}
.item .acts button:hover{color:var(--fg)}
.srclink{color:var(--accent);text-decoration:none}
.item .acts .sharebtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.item .acts .sharebtn svg{width:14px;height:14px}
.trst{font-size:12px;color:var(--gold);min-height:16px}
.shareopts{display:grid;gap:10px}
.shareopt{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:12px 14px;text-align:start}
.shareopt:hover{border-color:var(--accent)}
.shareopt:disabled{opacity:.55;cursor:default}
.shareopt .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.shareopt .ic svg{width:20px;height:20px}
.shareopt b{display:block;font-weight:600}
.shareopt small{display:block;color:var(--muted);font-size:12.5px}
.sharepv{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.sharehint{margin:0;color:var(--muted);font-size:13px}

/* Briefings */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar h1{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700;margin-inline-end:auto;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel-2)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.datein{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:6px 10px}
.bmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.range{color:var(--fg);font-weight:600;font-size:14px}
.review{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.review .ok{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.review .ok svg{width:15px;height:15px}
.review-act{margin-inline-start:auto}
.exec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px;overflow:hidden}
.exec .panel-h{background:var(--panel-2)}
.exec .txt{padding:14px 16px;white-space:pre-wrap;font-size:15px;line-height:1.7}
.exec .muted{padding:14px 16px;color:var(--muted);font-size:14px}
.exec .ed{padding:14px 16px;display:grid;gap:12px}
.brief-sum{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px}
.brief-sum div{flex:1 1 110px;padding:12px 16px;border-inline-end:1px solid var(--line)}
.brief-sum div:last-child{border-inline-end:0}
.brief-sum b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:500;line-height:1.2}
.brief-sum span{font-size:12px;color:var(--muted)}
.brief-sum .critical b{color:var(--sev-critical)}.brief-sum .high b{color:var(--sev-high)}.brief-sum .medium b{color:var(--sev-medium)}.brief-sum .low b{color:var(--sev-low)}.brief-sum .gold b{color:var(--gold)}
.bgroup{margin-bottom:12px}
.bgroup.dubai{border-color:color-mix(in srgb,var(--gold) 55%,var(--line))}
.bgroup.dubai>.panel-h{background:var(--gold-soft)}
.bgroup.dubai>.panel-h h2{color:var(--gold)}
.bgroup .count{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.ghead{cursor:pointer}
.subbar{display:flex;align-items:center;gap:10px;margin:4px 0 10px;flex-wrap:wrap}
.subbar .eyebrow{margin-inline-end:auto}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:780px;min-width:0}
.modal.narrow{max-width:560px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.modal header .iconbtn{margin-inline-start:auto}
.modal form{padding:16px 18px;display:grid;gap:14px}
.fsec{display:grid;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fsec:last-of-type{border-bottom:0;padding-bottom:0}
.fsec>.eyebrow{color:var(--fg)}
.field{display:grid;gap:5px;min-width:0}
.field>label,.field>.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:9px 11px;min-width:0}
.field textarea{min-height:90px;resize:vertical;line-height:1.55}
.field textarea.tall{min-height:150px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sevpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sevpick.five{grid-template-columns:repeat(5,1fr)}
.sevpick label{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);display:block}
.sevpick input{position:absolute;opacity:0;pointer-events:none}
.sevpick input:checked+label.critical{background:var(--sev-critical);color:#fff;border-color:transparent}
.sevpick input:checked+label.high{background:var(--sev-high);color:#fff;border-color:transparent}
.sevpick input:checked+label.medium{background:var(--sev-medium);color:#15202A;border-color:transparent}
.sevpick input:checked+label.low{background:var(--sev-low);color:#fff;border-color:transparent}
.sevpick input:checked+label.none,.sevpick input:checked+label.neutral{background:var(--fg);color:var(--bg);border-color:transparent}
.sevpick input:focus-visible+label{outline:2px solid var(--accent)}
.kinds{display:flex;gap:6px;flex-wrap:wrap}
.kinds button{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.kinds button svg{width:16px;height:16px}
.kinds button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.drop{border:1px dashed var(--line-2);border-radius:8px;padding:12px;display:grid;gap:8px;font-size:13px;color:var(--muted)}
.drop .files{display:flex;flex-wrap:wrap;gap:6px}
.fileitem{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:4px 6px 4px 8px;font-size:12px;color:var(--fg);max-width:100%}
.fileitem img{width:28px;height:22px;object-fit:cover;border-radius:3px}
.fileitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.fileitem button{border:0;background:none;color:var(--muted);padding:0 2px;font-size:15px;line-height:1}
.aibar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));background:var(--gold-soft);border-radius:8px;padding:10px 12px}
.aibar p{margin:0;font-size:12.5px;color:var(--muted);flex:1 1 240px;min-width:0}
.aibar .st{font-weight:600;color:var(--fg)}
.aibar .st.err{color:var(--sev-critical)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{appearance:none;width:40px;height:22px;border-radius:999px;background:var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch input:checked{background:var(--gold)}
.switch input:checked::after{inset-inline-start:21px}
.combo{position:relative}
.combo-list{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);max-height:240px;overflow:auto;z-index:5}
.formfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;z-index:3;background:var(--panel);margin:0 -18px -16px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.formfoot .btn{min-width:110px}
.formfoot .msg{margin-inline-end:auto;font-size:13px;color:var(--muted)}
.formfoot .msg.err{color:var(--sev-critical)}
.confirm{padding:18px;display:grid;gap:14px}
.confirm .formfoot{margin:0;position:static;border:0;padding:0}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:60;display:grid;place-items:center;padding:24px}
.lightbox img{max-width:100%;max-height:88vh;border-radius:6px}
.lightbox button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));inset-inline-end:max(14px,env(safe-area-inset-right,0px));background:#fff;color:#000;border:0;border-radius:8px;padding:6px 12px;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13.5px;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

  if(pts.size===2){ const [a,b]=[...pts.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:{...vb}}; drag=null; } });
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)){ hoverTip(e); return; }
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); const r=svg.getBoundingClientRect();
  if(pinch&&pts.size===2){ const [a,b]=[...pts.values()]; const f=pinch.d/Math.hypot(a.x-b.x,a.y-b.y); const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    const cx=pinch.vb.x+(mx-r.left)/r.width*pinch.vb.w, cy=pinch.vb.y+(my-r.top)/r.height*pinch.vb.h; vb={x:cx-(cx-pinch.vb.x)*f,y:cy-(cy-pinch.vb.y)*f,w:pinch.vb.w*f,h:pinch.vb.h*f}; clampVB(); setVB(); moved=true; return; }
  if(drag){ const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>5){ moved=true; svg.classList.add("dragging"); try{svg.setPointerCapture(e.pointerId);}catch(_){}
    vb.x=drag.vb.x-dx/r.width*vb.w; vb.y=drag.vb.y-dy/r.height*vb.h; clampVB(); setVB(); $("#tip").style.display="none"; } else hoverTip(e); } });
const endPtr=e=>{ const wm=moved; pts.delete(e.pointerId); if(pts.size<2) pinch=null; if(!pts.size){ drag=null; svg.classList.remove("dragging");
  if(!wm&&e.type==="pointerup"){ const el=document.elementFromPoint(e.clientX,e.clientY); if(el&&el.dataset&&el.dataset.c) openCountry(el.dataset.c); } } };
svg.addEventListener("pointerup",endPtr); svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("pointerleave",()=>{ $("#tip").style.display="none"; });
function hoverTip(e){ const el=e.target, tip=$("#tip"); if(el.dataset&&el.dataset.c&&e.pointerType==="mouse"){ const r=$("#mapbox").getBoundingClientRect(), c=el.dataset.c, n=countsByCountry()[c]||0, th=threats[c];
    tip.textContent=`${flag(c)} ${regionName(c)}${th&&SEVN[th.level]?` · ${t(th.level)}`:""}${n?` · ${n}`:""}`; tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px"; tip.style.display="block"; } else tip.style.display="none"; }

function loadMap(){

const q=$("#q"), qres=$("#qres"); let qhl=0, qlist=[];
function countryMatches(term,limit=12){
  const n=norm(term); if(!n) return [];
  const counts=countsByCountry();
  return ISO.map(c=>({c,en:regionName(c,"en"),ar:regionName(c,"ar")}))
    .filter(o=>norm(o.en).includes(n)||norm(o.ar).includes(n)||o.c.toLowerCase()===n)
    .sort((a,b)=>{ const s=o=>(norm(o.en).startsWith(n)||norm(o.ar).startsWith(n)?0:1); return s(a)-s(b)||(counts[b.c]||0)-(counts[a.c]||0); })
    .slice(0,limit);
}
q.addEventListener("input",()=>{ qlist=countryMatches(q.value); qhl=0; drawQ(); });

function periodRange(){

function phWrap(ctx,text,maxW){
  const out=[];
  for(const para of String(text||"").replace(/\r/g,"").split("\n")){
    const words=para.split(/[ \t]+/).filter(Boolean);
    if(!words.length){ out.push(""); continue; }
    let line="";
    for(let w of words){
      const test=line?line+" "+w:w;
      if(ctx.measureText(test).width<=maxW){ line=test; continue; }
      if(line) out.push(line);

        let part=""; for(const ch of [...w]){ if(ctx.measureText(part+ch).width>maxW&&part){ out.push(part); part=ch; } else part+=ch; } line=part;
      } else line=w;

  }
  return out;
}

async function buildPhonePng(n){
  const {canvas}=await phoneCanvas(n);
  return await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(new Error("png")),"image/png"));
}
async function buildPhonePdf(n){
  await loadJsPdf();
  const {canvas,W,H,S,cuts}=await phoneCanvas(n);
  const {jsPDF}=window.jspdf, MAXH=12000;
  const pages=[]; let top=0;
  while(top<H-1){
    let end=Math.min(top+MAXH,H);
    if(end<H){ const ok=cuts.filter(c=>c>top+200&&c<=end); if(ok.length) end=ok[ok.length-1]; }
    pages.push([top,end]); top=end;
  }
  let pdf=null;
  for(const [a,b] of pages){
    const h=b-a, sl=document.createElement("canvas"); sl.width=canvas.width; sl.height=Math.round(h*S);
    sl.getContext("2d").drawImage(canvas,0,Math.round(a*S),canvas.width,sl.height,0,0,canvas.width,sl.height);
    const fmt=[W,h], ori=h>=W?"portrait":"landscape";
    if(!pdf) pdf=new jsPDF({unit:"pt",format:fmt,orientation:ori,compress:true}); else pdf.addPage(fmt,ori);
    pdf.addImage(sl.toDataURL("image/jpeg",.92),"JPEG",0,0,W,h,undefined,"FAST");
  }
  return pdf.output("blob");
}

async function aiFillNews(){
  const msg=$("#nfAiMsg"), btn=$("#nfAi"); msg.className="";
  const setMsg=(s,err)=>{ msg.innerHTML=`<span class="st${err?" err":""}">${esc(s)}</span>`; };
  if(!sample){ setMsg(t("aiOff"),true); return; }
  const text=form.kinds.has("text")?$("#nfText").value.trim():"";
  let imgs=form.kinds.has("image")?form.newImgs.slice():[];
  if(imgs.length&&!(sampleLimits&&sampleLimits.images)) imgs=[];
  if(imgs.length&&sampleLimits.images){ imgs=imgs.filter(f=>sampleLimits.images.mediaTypes.includes(f.type)&&f.size<=sampleLimits.images.maxInputBytes).slice(0,sampleLimits.images.maxCount); }
  const vals={hEn:$("#nfHeadEn").value,hAr:$("#nfHeadAr").value,sEn:$("#nfSumEn").value,sAr:$("#nfSumAr").value,dEn:$("#nfDnEn").value,dAr:$("#nfDnAr").value};
  if(!text&&!imgs.length){
    // Nothing to analyse: translate whatever exists.
    btn.disabled=true;
    const r=await aiTranslate({headline:[vals.hEn,vals.hAr],summary:[vals.sEn,vals.sAr],note:[vals.dEn,vals.dAr]},{set textContent(s){ setMsg(s,s!==t("aiWorking")); }});
    btn.disabled=false;
    if(r){ if(r.headline){$("#nfHeadEn").value=r.headline[0];$("#nfHeadAr").value=r.headline[1];} if(r.summary){$("#nfSumEn").value=r.summary[0];$("#nfSumAr").value=r.summary[1];} if(r.note){$("#nfDnEn").value=r.note[0];$("#nfDnAr").value=r.note[1];} setMsg(t("aiTranslated")); }
    return;
  }
  btn.disabled=true; setMsg(t("aiWorking"));
  const cur=$("#nfCountry").dataset.code;
  try{
    const out=await sample.json(`You are a senior analyst at the Authorities & Critical Infrastructure Security Department (ACIS) of Dubai Police, which protects foreign diplomatic missions in Dubai. Analyse the news material below (copied from a risk-intelligence platform such as Seerist${imgs.length?"; screenshots are attached":""}).
${cur?`The analyst filed it under country code ${cur}; keep that unless the material is clearly about another country.`:""}
Return ONLY a JSON object with these keys:
"country": ISO 3166-1 alpha-2 code of the country the news is mainly about,
"headline_en": factual headline in formal English, at most 14 words,
"headline_ar": the same headline in formal Modern Standard Arabic as used in UAE government security reports,
"summary_en": 2 to 4 factual sentences in formal English,
"summary_ar": the same summary in formal Modern Standard Arabic,
"category": one of ${JSON.stringify(CATS)} (protest = protests & civil unrest; terror = terrorism; political = political instability; conflict = armed conflict; diplomatic = diplomatic tension; crime; cyber; hazard = natural disaster or health; other),
"severity": one of "critical","high","medium","low" (critical = ongoing or imminent attack or mass-casualty event, or a direct threat against diplomatic missions; high = significant violence, unrest or threats against state or diplomatic interests; medium = notable political or security developments; low = routine or background),
"affects_dubai": true only if the material shows a direct link to the UAE, to Dubai, or to that country's diplomatic mission or community in the UAE,
"dubai_note_en": one sentence on that link, or "",
"dubai_note_ar": the same in Arabic, or "".
Report only what the material says. Keep names, numbers and dates exact.

MATERIAL:
${text.slice(0,60000)||"(see attached screenshots)"}`,{modelTier:"default",...(imgs.length?{images:imgs}:{})});
    if(!out||typeof out!=="object") throw {code:"invalid_json"};
    const s=v=>typeof v==="string"?v.trim():"";
    if(s(out.headline_en)) $("#nfHeadEn").value=s(out.headline_en);
    if(s(out.headline_ar)) $("#nfHeadAr").value=s(out.headline_ar);
    if(s(out.summary_en)) $("#nfSumEn").value=s(out.summary_en);
    if(s(out.summary_ar)) $("#nfSumAr").value=s(out.summary_ar);

    form.sync(); setMsg(t("aiDone"));

async function saveNews(){
  const msg=$("#nfMsg"); msg.className="msg"; const err=m=>{ msg.textContent=m; msg.className="msg err"; };
  const country=$("#nfCountry").dataset.code;
  const headlineEn=$("#nfHeadEn").value.trim(), headlineAr=$("#nfHeadAr").value.trim();
  const summaryEn=$("#nfSumEn").value.trim(), summaryAr=$("#nfSumAr").value.trim();
  const original=form.kinds.has("text")?$("#nfText").value.trim():"";
  const keep=form.keep.filter(a=>form.kinds.has(a.kind));
  const pdfs=form.kinds.has("pdf")?form.newPdfs:[], imgs=form.kinds.has("image")?form.newImgs:[];
  if(!country) return err(t("errCountry"));
  if(!headlineEn&&!headlineAr) return err(t("errHeadline"));
  if(!original&&!summaryEn&&!summaryAr&&!keep.length&&!pdfs.length&&!imgs.length) return err(t("errContent"));
  if(!db) return err(t("errSave"));
  const btn=$("#nfSave"); btn.disabled=true;
  try{
    const uploaded=[];
    if(pdfs.length||imgs.length){
      if(!assets) throw {code:"no_assets"};
      msg.textContent=t("uploading");
      for(const f of pdfs){ const r=await assets.upload(f,{type:"application/pdf"}); uploaded.push({id:r.id,kind:"pdf",name:f.name}); }
      for(const f of imgs){ const type=/^image\/(png|jpeg|gif|webp)$/.test(f.type)?f.type:"image/png"; const r=await assets.upload(f,{type}); uploaded.push({id:r.id,kind:"image",name:f.name}); }
    }
    msg.textContent=t("saving");
    const now=Date.now(), old=form.id?news.find(n=>n.id===form.id):null;
    const affectsDubai=$("#nfDxb").checked;
    const data={country,headlineEn,headlineAr,summaryEn,summaryAr,original,
      category:$("#nfCat").value||"",affectsDubai,dubaiNoteEn:affectsDubai?$("#nfDnEn").value.trim():"",dubaiNoteAr:affectsDubai?$("#nfDnAr").value.trim():"",
      source:$("#nfSrc").value.trim(),link:old?.link||"",date:$("#nfDate").value||todayStr(),
      severity:(document.querySelector('input[name="nfSev"]:checked')||{}).value||"medium",attachments:[...keep,...uploaded],createdAt:old?.createdAt||now,updatedAt:now,verify:($("#nfVer")&&$("#nfVer").value)||""};
    if(old) for(const k of ["sources","mergedFrom","verifyNoteEn","verifyNoteAr","verifiedAt","auto"]) if(old[k]!==undefined&&old[k]!==null) data[k]=old[k];
    await (form.id?db.collection("news").doc(form.id):db.collection("news").doc()).set(data);
    const dropped=[...form.removed,...form.keep.filter(a=>!form.kinds.has(a.kind)).map(a=>a.id)];
    if(assets) for(const id of dropped){ try{ await assets.delete(id); }catch(_){} }
    closeModal(); toast(t("saved"));
    if(selected!==country) openCountry(country);
  }catch(e){ console.warn(e); btn.disabled=false; err(e&&e.code==="quota_exceeded"?t("errQuota"):t("errSave")); }
}
async function deleteNews(id){
  const n=news.find(x=>x.id===id); if(!n||!db) return;
  try{ await db.collection("news").doc(id).delete(); if(assets) for(const a of (n.attachments||[])){ try{ await assets.delete(a.id); }catch(_){} } toast(t("deleted")); }
  catch(e){ toast(t("errSave")); }
}

async function runLive(){
  if(liveBusy) return;
  const msg=$("#lvMsg"), btn=$("#lvRun"), log=$("#lvLog"); msg.className="msg";
  if(!liveSel.length){ msg.textContent=t("liveNone"); msg.className="msg err"; return; }
  if(!mcp||!sample||!db){ msg.textContent=t("liveOff"); msg.className="msg err"; return; }
  const days=+((($("#lvWin").querySelector('[aria-pressed="true"]')||{}).dataset||{}).d||3);
  const autoTh=$("#lvTh").checked; store("acis.liveTh",autoTh?"1":"0");
  store("acis.liveSel",JSON.stringify(liveSel));
  const list=liveSel.slice(); liveBusy=true; btn.disabled=true; btn.innerHTML=`${SPARK}${esc(t("liveRunning"))}`; msg.textContent="";
  log.hidden=false; log.innerHTML=list.map(c=>`<li data-lc="${c}"><span class="flag">${flag(c)}</span><span class="nm">${esc(regionName(c))}</span><span class="lst">${esc(t("liveSearching"))}</span></li>`).join("");
  const setRow=(c,html,cls)=>{ const li=log.querySelector(`[data-lc="${c}"]`); if(li){ li.querySelector(".lst").innerHTML=html; li.className=cls||""; } };
  let total=0, touched=0, fatal=null;
  const queue=list.slice();
  const worker=async()=>{ while(queue.length&&!fatal){ const c=queue.shift();
      try{ const r=await scanCountry(c,days,autoTh,s=>setRow(c,esc(s),"busy"));
        total+=r.saved; if(r.saved||r.th) touched++;
        setRow(c,(r.saved?`<b>${r.saved} ${esc(t("liveNew"))}</b>`:esc(t("liveNoNew")))+(r.th?" "+sevPill(r.th.level,true)+trendChip(r.th.trend):""),"ok"); }
      catch(e){ console.warn(e); if(e&&FATAL.has(e.code)) fatal=e; setRow(c,esc(t("liveFail")),"fail"); msg.textContent=e&&typeof e.code==="string"&&e.code.startsWith("ai:")?aiErr({code:e.code.slice(3)}):liveErrMsg(e); msg.className="msg err"; } } };
  await Promise.all([worker(),worker()]);
  if(fatal){ msg.textContent=liveErrMsg(fatal); msg.className="msg err"; for(const c of queue) setRow(c,"—","fail"); }
  else if(!log.querySelector(".fail")){ msg.textContent=t("liveDone").replace("{n}",total).replace("{c}",touched); msg.className="msg"; }
  liveBusy=false; btn.disabled=false; btn.innerHTML=`${SPARK}${esc(t("liveRun"))}`;
}

async function scanCountry(c,days,autoTh,step){
  const nameEn=regionName(c,"en"), today=todayStr(), from=addDays(today,-(days-1));
  const monthYear=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(new Date());
  step(t("liveSearching"));
  const res=await mcp.callTool(LIVE_SERVER,LIVE_TOOL,{
    objective:`Latest security-relevant news about ${nameEn} published between ${from} and ${today}: protests and unrest, terrorism, armed conflict, political instability, diplomatic tensions, attacks or threats against embassies or diplomats, major crime, cyber attacks, disasters and health emergencies. Prefer reputable international and national news agencies. Only recent articles.`,
    search_queries:[`${nameEn} security news ${monthYear}`,`${nameEn} protests attack ${monthYear}`,`${nameEn} embassy diplomatic tensions`],
    session_id:LIVE_SID
  },{cache:false});
  let raw=res&&res.payload!==undefined?res.payload:res;

   execute(i){ i=i||{}; const tx=norm(i.text||""), min=SEVN[i.min_severity]||0, lim=Math.min(50,Math.max(1,+i.limit||25)); const cc=String(i.country||"").toUpperCase();

  {name:"get_threat_levels",description:"Current threat level, trend and assessment for every assessed country.",inputSchema:{type:"object",properties:{}},
   execute(){ return Object.entries(threats).filter(([c,th])=>SEVN[th.level]&&ISOSET.has(c)).map(([c,th])=>({country:c,name:regionName(c,"en"),level:th.level,trend:th.trend||"steady",assessment:th.noteEn||th.noteAr||"",updated:th.updatedAt?new Date(th.updatedAt).toISOString().slice(0,10):""})); }},

  {name:"get_overview",description:"Counts of entries by severity for the last 1, 7 and 30 days.",inputSchema:{type:"object",properties:{}},

function fmtAnswer(txt){
  let h=esc(txt).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  h=h.replace(/\[\[([A-Za-z0-9_-]{1,64})\]\]/g,(m,id)=>{ const n=news.find(x=>x.id===id); return n?`<button class="cite" data-cite="${id}" title="${esc(L(n,"headline"))}">${flag(n.country)} ${esc(fmtDate(n.date,{day:"numeric",month:"short"}))}</button>`:""; });
  return h.split(/\n{2,}/).map(par=>{ const lines=par.split("\n"); if(lines.every(l=>/^\s*[-•]\s+/.test(l))) return `<ul>${lines.map(l=>`<li>${l.replace(/^\s*[-•]\s+/,"")}</li>`).join("")}</ul>`; return `<p>${lines.join("<br>")}</p>`; }).join("");
}

async function askSend(){
  const inp=$("#askIn"), q=inp.value.trim(); if(!q||askBusy) return;
  if(!sample){ toast(t("askOff")); return; }
  inp.value=""; askBusy=true; $("#askGo").disabled=true;
  const prior=[]; for(let i=0;i+1<askHist.length;i+=2){ const u=askHist[i], a2=askHist[i+1]; if(u.role==="user"&&a2&&a2.content&&!a2.err) prior.push(u,a2); }
  askHist.push({role:"user",content:q}); const a={role:"assistant",content:"",pending:true}; askHist.push(a); renderAsk();
  const msgs=[]; prior.forEach((m,i)=>msgs.push({role:m.role,content:i===0?ASK_INSTR()+"\n\nQUESTION: "+m.content:m.content}));
  msgs.push({role:"user",content:msgs.length?q:ASK_INSTR()+"\n\nQUESTION: "+q});
  askCtl=new AbortController();
  try{ const r=await sample(msgs,{tools:ASK_TOOLS,modelTier:"default",cache:false,signal:askCtl.signal,onText:({text})=>{ if(text&&text!=="Thinking..."){ a.content=text; renderAsk(); } }});
    a.content=(r&&r.text)||a.content; }
  catch(e){ console.warn(e); a.err=aiErr(e); if(e&&e.text) a.content=e.text; }

}

const fill=(s,o)=>String(s).replace(/\{(\w+)\}/g,(m,k)=>o[k]??m);
const weekStart=s=>{ const [y,m,d]=String(s||"").split("-").map(Number); if(!y||!m||!d) return null; const dt=new Date(y,m-1,d), dow=(dt.getDay()+6)%7; return todayStr(new Date(y,m-1,d-dow)); };

/* Countries checked by an update: assessed countries (highest level first), missions in Dubai, the last live-scan selection, then countries with recent news. */
function updCountries(){
  const out=[], add=c=>{ if(c&&ISOSET.has(c)&&!out.includes(c)&&out.length<LIVE_MAX) out.push(c); };
  Object.entries(threats).filter(([c,th])=>th&&SEVN[th.level]).sort((a,b)=>SEVN[b[1].level]-SEVN[a[1].level]||(b[1].trend==="up")-(a[1].trend==="up")).forEach(([c])=>add(c));
  missionList().forEach(m=>add(m.c));
  let last=[]; try{ last=JSON.parse(store("acis.liveSel")||"[]"); }catch(_){} if(Array.isArray(last)) last.forEach(add);
  const from=addDays(todayStr(),-13), cnt={}; news.filter(n=>n.date>=from).forEach(n=>cnt[n.country]=(cnt[n.country]||0)+1);
  Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).forEach(add);
  return out;
}
function renderUpd(){
  const b=$("#updBtn");
  if(b){ b.classList.toggle("spin",updRunning); b.disabled=updRunning; const sp=b.querySelector("span"); if(sp) sp.textContent=updRunning&&updProg?fill(t("updRunning"),updProg):t("updBtn");
    b.title=metaUpd&&metaUpd.at?`${t("updLast")}: ${fmtTs(metaUpd.at)}`:t("updNever"); }
  const l=$("#updLine"); if(!l) return;
  if(updRunning){ l.hidden=false; l.innerHTML=`<i class="updot"></i><span>${esc(updProg?fill(t("updRunning"),updProg):t("updAuto"))}</span>`; return; }
  if(metaUpd&&metaUpd.at){ l.hidden=false; l.innerHTML=`<span>${esc(t("updLast"))}: <b class="mono">${esc(fmtTs(metaUpd.at))}</b></span>${metaUpd.total?`<span class="newc">· ${metaUpd.total} ${esc(t("updNew"))}</span>`:""}`; }
  else l.hidden=true;

async function runUpdate(auto){
  if(updRunning) return;
  if(!isOwner){ if(!auto) toast(metaUpd&&metaUpd.at?`${t("updLast")}: ${fmtTs(metaUpd.at)} · ${t("updViewer")}`:t("updViewer")); return; }
  if(!mcp||!sample||!db){ if(!auto) toast(t("liveOff")); return; }
  const list=updCountries(); if(!list.length){ if(!auto) toast(t("liveNone")); return; }
  let lease=null;
  try{ lease=await db.doc("meta/lock").acquire({holder:LIVE_SID,ttlMs:15*60*1000}); }catch(_){ lease=null; }
  if(lease&&lease.acquired===false){ if(!auto) toast(t("updBusy")); return; }
  const lastAt=(metaUpd&&metaUpd.at)||0, hrs=(Date.now()-lastAt)/36e5;
  const days=!lastAt?7:hrs<=24?1:hrs<=72?3:7;
  const autoTh=store("acis.liveTh")!=="0";
  updRunning=true; updProg={i:0,n:list.length}; renderUpd();
  let total=0, touched=0, failed=0, fatal=null, doneN=0; const queue=list.slice();
  const worker=async()=>{ while(queue.length&&!fatal){ const c=queue.shift();
      try{ const r=await scanCountry(c,days,autoTh,()=>{}); total+=r.saved; if(r.saved||r.th) touched++; }
      catch(e){ console.warn(e); failed++; if(e&&FATAL.has(e.code)) fatal=e; }
      doneN++; updProg={i:doneN,n:list.length}; renderUpd(); } };
  try{ await Promise.all([worker(),worker()]); }
  finally{
    updRunning=false; updProg=null;
    if(!fatal||total){ try{ await db.doc("meta/update").set({at:Date.now(),total,countries:list.length,touched,failed,days,auto:!!auto,by:myId||""}); }catch(_){} }
    renderUpd();
  }
  if(fatal){ toast(liveErrMsg(fatal)); return; }
  toast((total?fill(t("updDone"),{n:total,c:touched}):t("updNone"))+(failed?" "+fill(t("updFailN"),{f:failed}):""));
}
/* Runs once per opening, after the records have loaded; skipped if an update finished in the last 20 minutes. */
function maybeAuto(){
  if(autoTried||!newsLive||!countriesLive||!metaLive) return;
  autoTried=true;
  if(!isOwner||!mcp||!sample||!db) return;
  if(metaUpd&&metaUpd.at&&Date.now()-metaUpd.at<UPD_GAP) return;
  setTimeout(()=>runUpdate(true),1500);
}

/* ---------- Weekly archive: weeks/<monday> summary + weekparts/<monday>-p<i> item copies ---------- */
const hashStr=s=>{ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); };
const ARCH_KEYS=["country","date","severity","category","affectsDubai","headlineEn","headlineAr","headline","summaryEn","summaryAr","summary","original","dubaiNoteEn","dubaiNoteAr","source","link","attachments","auto","createdAt","updatedAt"];
const archItem=n=>{ const o={id:n.id}; for(const k of ARCH_KEYS){ const v=n[k]; if(v!==undefined&&v!==null&&v!=="") o[k]=v; } if(typeof o.original==="string"&&o.original.length>20000) o.original=o.original.slice(0,20000); return o; };
const enc=new TextEncoder();
const partCache=new Map();
let syncBusy=false, syncAgain=false, syncTimer=null;
function scheduleSync(){ if(!isOwner||!db) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncWeeks,2500); }
async function loadParts(w){
  const d=weekDocs[w]; if(!d||!d.parts) return [];
  if(!db){ const out=[]; for(let i=0;i<d.parts;i++){ const p=SNAP_PARTS[`${w}-p${i}`]; if(p&&Array.isArray(p.items)) out.push(...p.items); } return out; }
  const snaps=await Promise.all(Array.from({length:d.parts},(_,i)=>db.doc(`weekparts/${w}-p${i}`).get().catch(()=>null)));
  const out=[]; snaps.forEach(s=>{ const it=s&&s.exists&&s.data()&&s.data().items; if(Array.isArray(it)) out.push(...it); }); return out;
}
async function syncWeeks(){
  if(syncBusy){ syncAgain=true; return; }
  if(!isOwner||!db||!newsLive||!weeksLive) return;
  syncBusy=true;
  try{
    const by={}; for(const n of news){ const w=weekStart(n.date); if(w) (by[w] ||= []).push(n); }
    for(const [w,list] of Object.entries(by).sort()){
      const sig=hashStr(list.map(n=>n.id+":"+(n.updatedAt||n.createdAt||0)).sort().join("|"));
      const cur=weekDocs[w];
      if(cur&&cur.sig===sig&&cur.parts) continue;
      // Keep everything already archived for this week, then add or refresh the current entries.
      const map=new Map(); (await loadParts(w)).forEach(it=>{ if(it&&it.id) map.set(it.id,it); });
      list.forEach(n=>map.set(n.id,archItem(n)));
      const items=[...map.values()].sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
      const parts=[]; let p=[], size=40;
      for(const it of items){ const sz=enc.encode(JSON.stringify(it)).length+1; if(p.length&&size+sz>200000){ parts.push(p); p=[]; size=40; } p.push(it); size+=sz; }
      if(p.length) parts.push(p);
      for(let i=0;i<parts.length;i++) await db.doc(`weekparts/${w}-p${i}`).set({week:w,part:i,items:parts[i],savedAt:Date.now()});
      const c={critical:0,high:0,medium:0,low:0}; items.forEach(it=>{ if(c[it.severity]!==undefined) c[it.severity]++; });
      await db.doc("weeks/"+w).set({start:w,end:weekEnd(w),count:items.length,countries:new Set(items.map(i=>i.country)).size,dubai:items.filter(i=>i.affectsDubai).length,...c,parts:Math.max(parts.length,(cur&&cur.parts)||0),sig,savedAt:Date.now()});

function layoutDoc(doc,fmt,pal,l,unbounded,logos){
  const W=fmt.W, M=fmt.M, k=fmt.k, cw=W-2*M;
  const G={W,M,k,cw,pal,dir:l==="ar"?"rtl":"ltr",m:document.createElement("canvas").getContext("2d"),fmt,logos};
  const headH=24*k, footH=30*k, bottom=unbounded?Infinity:fmt.H-footH-8*k;
  const made=doc.blocks.map(b=>({b,...b.make(G)})).filter(x=>x.rows&&x.rows.length);
  const pages=[]; let page=null, y=0;
  const newPage=()=>{ page={ops:[],links:[],top:0}; pages.push(page); page.top=pages.length===1?(made[0]&&made[0].b.plate?0:M*.8):M*.6+headH; y=page.top; };
  newPage();
  const fresh=()=>y<=page.top+.5;
  const total=x=>x.rows.reduce((s,r)=>s+r.h,0)+(x.card?2*x.card.pad*k:0);
  const headOf=x=>{ const n=Math.min(x.rows.length,3); let h=0; for(let i=0;i<n;i++) h+=x.rows[i].h; return h+(x.card?2*x.card.pad*k:0); };
  made.forEach((x,bi)=>{
    const pad=x.card?x.card.pad*k:0, mt=(x.b.mt??10)*k, tot=total(x), cap=bottom-(M*.6+headH);
    if(!fresh()) y+=mt;
    let need=tot; if(x.b.keepNext&&made[bi+1]) need+=(made[bi+1].b.mt??10)*k+headOf(made[bi+1]);
    if(!fresh()&&y+need>bottom){ if(tot<=cap*.6||x.b.keepNext||y+headOf(x)>bottom) newPage(); }
    let i=0;
    while(i<x.rows.length){
      const avail=bottom-y-2*pad; let j=i, hs=0;
      while(j<x.rows.length&&hs+x.rows[j].h<=avail){ hs+=x.rows[j].h; j++; }
      while(j<x.rows.length&&j>i+1&&x.rows[j-1].kwn){ j--; hs-=x.rows[j].h; }
      if(j===i){ if(fresh()){ hs=x.rows[i].h; j=i+1; } else { newPage(); continue; } }
      const fy=y, fh=hs+2*pad, cd=x.card;
      if(cd) page.ops.push(c=>{ c.fillStyle=cd.bg; rrect(c,M+.5,fy+.5,cw-1,fh-1,cd.radius*k); c.fill(); if(cd.border){ c.strokeStyle=cd.border; c.lineWidth=cd.border===pal.cardLine?1:1.2; c.stroke(); } });
      let ry=fy+pad;
      for(let q=i;q<j;q++){ const r=x.rows[q], yy=ry, ix=M+pad, iw=cw-2*pad; page.ops.push(c=>{ c.save(); r.draw(c,ix,yy,iw); c.restore(); }); if(r.link) page.links.push({x:ix,y:yy,w:iw,h:r.h,url:r.link}); ry+=r.h; }
      y=fy+fh; i=j;
      if(i<x.rows.length) newPage();
    }
  });
  return {pages,end:y,headH,footH,G};
}

    o[k]=light?inkLogo(im,pal.ink):im; }

function drawChrome(c,doc,L,fmt,pal,l,p,n,H){
  const k=fmt.k, M=fmt.M, W=fmt.W;
  if(p>0&&H!==Infinity){ c.font=dfont(10.5*k,700); c.fillStyle=pal.muted; c.textBaseline="middle"; const d=l==="ar"?"rtl":"ltr"; c.direction=d; c.textAlign=d==="rtl"?"right":"left"; c.fillText(doc.short||doc.title,d==="rtl"?W-M:M,M*.6+L.headH/2-3*k); c.fillStyle=pal.line; c.fillRect(M,M*.6+L.headH-4*k,W-2*M,1); }
  const fy=H-L.footH; c.fillStyle=pal.line; c.fillRect(M,fy,W-2*M,1); c.font=dfont(9.5*k,400); c.fillStyle=pal.faint; c.textBaseline="middle";
  const foot=trL("docFoot",l), pg=fill(trL("pageOf",l),{n:p+1,t:n}), rtl=l==="ar";
  c.direction=rtl?"rtl":"ltr"; c.textAlign=rtl?"right":"left"; c.fillText(foot,rtl?W-M:M,fy+L.footH/2);
  c.textAlign=rtl?"left":"right"; c.fillText(pg,rtl?M:W-M,fy+L.footH/2);
}
async function docPdf(doc,fmtKey,theme,l){
  await loadJsPdf(); await docFonts();
  const fmt=DOCFMT[fmtKey], pal=DOCPAL[theme]||DOCPAL.light, logos=await docLogos(pal);
  const L=layoutDoc(doc,fmt,pal,l,false,logos), n=L.pages.length, {jsPDF}=window.jspdf;
  let pdf=null;
  for(let p=0;p<n;p++){
    const pg=L.pages[p], cv=document.createElement("canvas"); cv.width=Math.round(fmt.W*fmt.S); cv.height=Math.round(fmt.H*fmt.S); cv.setAttribute("dir",l==="ar"?"rtl":"ltr");
    const c=cv.getContext("2d"); c.scale(fmt.S,fmt.S); c.fillStyle=pal.bg; c.fillRect(0,0,fmt.W,fmt.H);
    for(const f of pg.ops){ c.save(); f(c); c.restore(); }
    drawChrome(c,doc,L,fmt,pal,l,p,n,fmt.H);
    const dims=[fmt.W,fmt.H];
    if(!pdf) pdf=new jsPDF({unit:"pt",format:dims,orientation:"portrait",compress:true}); else pdf.addPage(dims,"portrait");

    for(const lk of pg.links){ try{ pdf.link(lk.x,lk.y,lk.w,lk.h,{url:lk.url}); }catch(_){} }
    cv.width=cv.height=1;
  }
  pdf.setProperties({title:doc.title,subject:doc.short||doc.title,author:"ACIS — Dubai Police",creator:"ACIS Security Analysis",keywords:"ACIS, Dubai Police"});
  return pdf.output("blob");
}
async function docPng(doc,theme,l){
  await docFonts();

  const cv=document.createElement("canvas"); cv.width=Math.round(fmt.W*S); cv.height=Math.round(H*S); cv.setAttribute("dir",l==="ar"?"rtl":"ltr");
  const c=cv.getContext("2d"); c.scale(S,S); c.fillStyle=pal.bg; c.fillRect(0,0,fmt.W,H);

  return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("png")),"image/png"));
}

function newsBlock(n,l,showCountry){
  const v=normNews(n), head=l==="ar"?(v.hAr||v.hEn):(v.hEn||v.hAr), body=l==="ar"?(v.sAr||v.sEn||v.orig):(v.sEn||v.sAr||v.orig);
  const dn=n.affectsDubai?(l==="ar"?(v.dAr||v.dEn):(v.dEn||v.dAr)):"";
  const chips=[{t:trL(n.severity,l),tone:"sev:"+n.severity}];
  if(n.verify&&T.en["ver_"+n.verify]) chips.push({t:trL("ver_"+n.verify,l),tone:n.verify==="confirmed"?"accent":n.verify==="unconfirmed"?"gold":"chip"});
  if(n.category&&T[l].cats[n.category]) chips.push({t:T[l].cats[n.category]});
  if(n.affectsDubai) chips.push({t:trL("affectsDubai",l),tone:"gold"});
  const meta=[showCountry?regionName(n.country,l):"",fdL(n.date,null,l),n.sources&&n.sources.length>1?`${trL("srcList",l)}: ${n.sources.map(x=>x&&x.name).filter(Boolean).join(l==="ar"?"، ":", ")}`:n.source?`${trL("source",l)}: ${n.source}`:""].filter(Boolean).join("  ·  ");
  return DB.card({chips,meta,head,body,note:dn?trL("linkDubai",l)+dn:""});
}
function groupBlock(k,l,by){
  if(by==="category") return DB.h2(T[l].cats[k]||k);
  const th=threats[k], has=th&&SEVN[th.level];
  return DB.h2(regionName(k,l),has?[{t:trL(th.level,l),tone:"sev:"+th.level},th.trend?{t:`${TREND_GLYPH[th.trend]} ${trL(TREND_KEY[th.trend],l)}`}:null].filter(Boolean):[]);
}
function statsBlock(items,l){
  const c={critical:0,high:0,medium:0,low:0}; items.forEach(n=>{ if(c[n.severity]!==undefined) c[n.severity]++; });
  return DB.stats([{v:items.length,l:trL("total",l)},{v:new Set(items.map(n=>n.country)).size,l:trL("countries",l)},{v:items.filter(n=>n.affectsDubai).length,l:trL("dubaiCount",l),c:"gold"},...SEVS.map(s=>({v:c[s],l:trL(s,l),c:SEVHEX[s]}))]);
}
function newsSections(items,l,by){
  const out=[], dubai=items.filter(n=>n.affectsDubai).sort(bySev), rest=items.filter(n=>!n.affectsDubai), groups={};
  rest.forEach(n=>{ const k=by==="category"?(n.category||"other"):n.country; (groups[k] ||= []).push(n); });
  const order=Object.keys(groups).sort((x,y)=>SEVN[maxSev(groups[y])]-SEVN[maxSev(groups[x])]||groups[y].length-groups[x].length);
  if(dubai.length){ out.push(DB.h2(trL("dubaiSection",l),[{t:String(dubai.length),tone:"gold"}])); dubai.forEach(n=>out.push(newsBlock(n,l,true))); }
  order.forEach(k=>{ out.push(groupBlock(k,l,by)); groups[k].sort(bySev).forEach(n=>out.push(newsBlock(n,l,by==="category"))); });
  return out;
}

let forecasts=[], fcBusy=false, fcFilter="all";
const FC_H={"72h":{days:3,key:"h72"},week:{days:7,key:"hWeek"},month:{days:30,key:"hMonth"}};
const LIKES=["very_likely","likely","possible","unlikely"];
const LIKECOL={very_likely:"#1E7A4F",likely:"#3B6FB8",possible:"#A9850F",unlikely:"#8794A0"};
const OUTTONE={happened:"accent",partly:"gold",not_yet:"chip",did_not:"chip"};

const fcNames=(f,l)=>(f.countries||[]).map(c=>regionName(c,l)).join(l==="ar"?"، ":", ");

const fcTier=()=>{ const ts=sampleLimits&&sampleLimits.modelTiers; return !ts||ts.includes("complex")?"complex":"default"; };
const SPARKSM=SPARK.replace("<svg",'<svg width="14" height="14"');

/* Countries for "all active": assessed at medium or above, plus any with news in the last 14 days. */
function fcActive(){
  const from=addDays(todayStr(),-13), score={};
  news.filter(n=>n.date>=from).forEach(n=>score[n.country]=Math.max(score[n.country]||0,SEVN[n.severity]||0)+.01);
  Object.entries(threats).forEach(([c,th])=>{ if(th&&SEVN[th.level]>=2) score[c]=Math.max(score[c]||0,SEVN[th.level]+.5); });
  return Object.keys(score).filter(c=>ISOSET.has(c)).sort((a,b)=>score[b]-score[a]).slice(0,10);
}
async function fcWeb(c,focus,since){
  const nameEn=regionName(c,"en"), my=new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"}).format(new Date());
  const fw=String(focus||"").replace(/[^\p{L}\p{N}\s-]/gu," ").split(/\s+/).filter(Boolean).slice(0,4).join(" ");
  const res=await mcp.callTool(LIVE_SERVER,LIVE_TOOL,{
    objective:`Latest developments, official statements and expert analysis about ${nameEn}${focus?` concerning: ${focus}`:""}${since?` since ${since}`:""}. Focus on what the government and other involved parties have done or are likely to do next. Prefer reputable news agencies and analysis from the last two weeks.`,
    search_queries:[fw?`${nameEn} ${fw}`:`${nameEn} security outlook ${my}`,`${nameEn} government response statement`,`${nameEn} analysis what next`],
    session_id:LIVE_SID},{cache:false});
  let raw=res&&res.payload!==undefined?res.payload:res;
  if(raw&&typeof raw==="object"&&Array.isArray(raw.results)) raw=raw.results.slice(0,8).map(r=>({url:r.url,title:String(r.title||"").trim(),date:r.publish_date||"",text:(Array.isArray(r.excerpts)?r.excerpts.join(" … "):String(r.excerpts||"")).replace(/\s+/g," ").slice(0,1600)}));
  return (typeof raw==="string"?raw:JSON.stringify(raw||"")).slice(0,14000);
}
function fcContext(cs,since){
  const from=since||addDays(todayStr(),-30), ids=[];
  const ctx=cs.map(c=>{ const th=threats[c], list=news.filter(n=>n.country===c&&n.date>=from).sort(bySev).slice(0,since?30:18);
    list.forEach(n=>ids.push(n.id));
    return {country:c,name:regionName(c,"en"),threat_level:th&&SEVN[th.level]?th.level:"not assessed",trend:th&&th.trend||"",assessment:th&&(th.noteEn||th.noteAr)||"",
      mission_in_dubai:th&&th.mission?`${T.en.mt[th.mission.type]||th.mission.type} in ${(AREAS[th.mission.area]||AREAS.other)[2]}`:"",
      saved_news:list.map(n=>({id:n.id,date:n.date,severity:n.severity,category:n.category||"",affects_dubai:!!n.affectsDubai,headline:n.headlineEn||n.headline||n.headlineAr||"",summary:(n.summaryEn||n.summaryAr||n.original||n.summary||"").slice(0,550)}))}; });
  return {ctx,ids};
}
const S_=v=>typeof v==="string"?v.trim():"";
const pair=(o,a)=>({en:S_(o&&o[a+"_en"]),ar:S_(o&&o[a+"_ar"])});
function fcNormalize(out,base,ids){
  if(!out||typeof out!=="object") throw {code:"invalid_json"};
  const scen=(Array.isArray(out.scenarios)?out.scenarios:[]).slice(0,4).map(x=>{ const lk=LIKES.includes(x&&x.likelihood)?x.likelihood:"possible"; let p=Math.round(+x.probability); if(!(p>0&&p<100)) p={very_likely:85,likely:65,possible:40,unlikely:15}[lk];
    return {name:pair(x,"name"),desc:pair(x,"desc"),likelihood:lk,prob:p,time:pair(x,"timeframe")}; }).filter(x=>x.name.en||x.name.ar);
  if(!scen.length) throw {code:"invalid_json"};
  scen.sort((a,b)=>b.prob-a.prob);
  const idset=new Set(ids);
  return {...base,title:pair(out,"title"),bluf:pair(out,"bluf"),
    summaries:(Array.isArray(out.summaries)?out.summaries:[]).map(s=>({country:S_(s&&s.country).toUpperCase(),en:S_(s&&s.en),ar:S_(s&&s.ar)})).filter(s=>ISOSET.has(s.country)&&(s.en||s.ar)),
    scenarios:scen,indicators:(Array.isArray(out.indicators)?out.indicators:[]).slice(0,7).map(i=>({en:S_(i&&i.en),ar:S_(i&&i.ar)})).filter(i=>i.en||i.ar),
    dubai:{level:["high","medium","low","none"].includes(out.dubai_level)?out.dubai_level:"none",...pair(out,"dubai")},
    confidence:{level:["high","medium","low"].includes(out.confidence)?out.confidence:"medium",...pair(out,"confidence")},
    basis:(Array.isArray(out.basis)?out.basis:[]).map(String).filter(id=>idset.has(id)).slice(0,12),
    sources:(Array.isArray(out.sources)?out.sources:[]).filter(s=>s&&/^https?:\/\//i.test(S_(s.url))).slice(0,6).map(s=>({title:S_(s.title).slice(0,160)||S_(s.url),url:S_(s.url)}))};
}
const FC_RULES=`Use standard estimative language and be specific, balanced and sober; do not sensationalise. Base every judgement on the material given; say when evidence is thin. Do not recommend patrols, guarding, physical protection measures or any operational security steps. Arabic must be formal Modern Standard Arabic as used in UAE government security reports; English must be formal British English.`;
const FC_JSON=multi=>`Return ONLY a JSON object:
{"title_en":"short title","title_ar":"…",
 "bluf_en":"bottom line in 2-3 sentences","bluf_ar":"…",${multi?`
 "summaries":[{"country":"ISO2 code","en":"2-3 sentence summary of that country's recent news","ar":"…"}],`:""}
 "scenarios":[{"name_en":"short name","name_ar":"…","desc_en":"2-3 sentences: what would happen, who acts, what would trigger it","desc_ar":"…","likelihood":"very_likely|likely|possible|unlikely","probability":0-100,"timeframe_en":"e.g. within 72 hours","timeframe_ar":"…"}],
 "indicators":[{"en":"an observable sign to watch","ar":"…"}],
 "dubai_level":"high|medium|low|none","dubai_en":"possible effect on Dubai, the UAE, or that country's mission or community in Dubai (awareness level only)","dubai_ar":"…",
 "confidence":"high|medium|low","confidence_en":"one or two sentences on why","confidence_ar":"…",
 "basis":["ids of the saved entries you relied on"],
 "sources":[{"title":"…","url":"exact URL from the web results"}]}
Give 3 or 4 scenarios, most likely first; they may overlap. Probability guide: very_likely 75-95, likely 55-75, possible 25-55, unlikely 5-25. Give 4 to 6 indicators and up to 6 sources.`;

function fcProgress(steps){
  openModal(t("fcNew"),`<div class="confirm"><ul class="lv-log fc-steps" id="fcSteps">${steps.map((s,i)=>`<li data-st="${i}"><span class="nm">${esc(s)}</span><span class="lst">—</span></li>`).join("")}</ul><p class="sharehint">${esc(t("fcWorking"))}</p><div class="formfoot"><span class="msg" id="fcMsg"></span><button type="button" class="btn ghost" id="fcHide">${esc(t("close"))}</button></div></div>`,true);
  $("#fcHide").onclick=closeModal;
  return (i,state,txt)=>{ const li=document.querySelector(`#fcSteps [data-st="${i}"]`); if(!li) return; li.className=state; li.querySelector(".lst").textContent=txt||(state==="ok"?"✓":state==="busy"?"":"—"); };
}
async function runForecast(opt){
  if(fcBusy){ toast(t("fcBusy")); return; }
  if(!sample){ toast(t("aiOff")); return; }
  fcBusy=true;
  const ev=opt.newsId?news.find(x=>x.id===opt.newsId):null;
  const cs=(opt.countries||[]).filter(c=>ISOSET.has(c)).slice(0,opt.kind==="multi"?10:1);
  const step=fcProgress([t("fcStep1"),t("fcStep2"),t("fcStep3"),t("fcStep4")]);
  let webUsed=false;
  try{
    step(0,"busy"); const {ctx,ids}=fcContext(cs); step(0,"ok");
    step(1,"busy"); let web=[];
    if(opt.web&&mcp){ const focus=ev?(ev.headlineEn||ev.headline||ev.headlineAr||""):"";
      for(const c of cs.slice(0,opt.kind==="multi"?4:1)){ try{ web.push({country:c,results:await fcWeb(c,focus)}); webUsed=true; }catch(e){ console.warn(e); if(e&&FATAL.has(e.code)) break; } } }
    step(1,webUsed?"ok":"skip",webUsed?"✓":"—");
    step(2,"busy");
    const today=todayStr(), hz=FC_H[opt.horizon]||FC_H.week, hzTxt=trL(hz.key,"en");
    const event=ev?{id:ev.id,country:ev.country,country_name:regionName(ev.country,"en"),date:ev.date,severity:ev.severity,category:ev.category||"",headline:ev.headlineEn||ev.headline||ev.headlineAr||"",summary:(ev.summaryEn||ev.summaryAr||ev.original||ev.summary||"").slice(0,2500),affects_dubai:!!ev.affectsDubai}:null;
    const task=opt.kind==="news"?`Forecast how ${regionName(ev.country,"en")} — the state affected by the event below — is likely to respond over the horizon, and how other involved parties may react in turn. If the event is an attack by another state or group, cover the range of possible responses (diplomatic, legal, economic, military or security), from the most to the least likely.\nEVENT: ${JSON.stringify(event)}`
      :opt.kind==="country"?`Assess what is likely to happen next in ${regionName(cs[0],"en")} over the horizon, including how its government is likely to act in response to recent events and how the situation may evolve.`
      :`For the countries below, first write a short summary of each country's recent news (one entry per country in "summaries", in the same order), then forecast the most significant developments to expect across them over the horizon. Scenarios may concern different countries; name the country in each scenario.`;
    const prompt=`You are a senior intelligence analyst at the Authorities & Critical Infrastructure Security Department (ACIS) of Dubai Police, which protects foreign diplomatic missions in Dubai. Today is ${today}. Produce a structured analytic forecast.
TASK: ${task}
HORIZON: the next ${hzTxt}.
${FC_RULES}
${FC_JSON(opt.kind==="multi")}

DEPARTMENT RECORDS (saved news and assessments):
${JSON.stringify(ctx).slice(0,60000)}

RECENT WEB RESULTS:
${web.length?web.map(w=>`[${w.country}] ${w.results}`).join("\n\n").slice(0,40000):"(none available)"}`;
    const out=await sample.json(prompt,{modelTier:fcTier(),cache:false});
    const f=fcNormalize(out,{kind:opt.kind,countries:cs,newsId:ev?ev.id:"",horizon:opt.horizon in FC_H?opt.horizon:"week",web:webUsed,createdAt:Date.now(),by:myId||"",
      event:event?{country:ev.country,date:ev.date,severity:ev.severity,headline:{en:ev.headlineEn||(!hasAr(ev.headline)?ev.headline:"")||"",ar:ev.headlineAr||(hasAr(ev.headline)?ev.headline:"")||""},summary:{en:(ev.summaryEn||"").slice(0,2000),ar:(ev.summaryAr||(hasAr(ev.summary)?ev.summary:"")||"").slice(0,2000)}}:null},ids);
    step(2,"ok");
    step(3,"busy"); let saved=false;
    if(db&&isOwner){ try{ const ref=db.collection("forecasts").doc(); await ref.set(f); f.id=ref.id; saved=true; }catch(e){ console.warn(e); } }
    if(!saved) f.id="tmp-"+Date.now();
    step(3,saved?"ok":"skip");
    fcBusy=false;
    if(saved) toast(t("fcSaved"));
    openFc(f,saved?"":t("fcNotSaved"));
  }catch(e){ console.warn(e); fcBusy=false; const m=$("#fcMsg"); const txt=e&&e.code&&e.code!=="invalid_json"?aiErr(e):t("fcFail"); if(m){ m.textContent=txt; m.className="msg err"; } else toast(txt); }
}
function fcForNews(id){ return forecasts.find(f=>f.newsId===id); }
function fcNewsClick(id){ const ex=fcForNews(id); if(ex) openFc(ex); else { const n=news.find(x=>x.id===id); if(n) runForecast({kind:"news",countries:[n.country],newsId:id,horizon:"week",web:true}); } }
function fcCountryClick(c){ const ex=forecasts.find(f=>f.kind==="country"&&f.countries&&f.countries[0]===c&&Date.now()-f.createdAt<864e5); if(ex) openFc(ex); else runForecast({kind:"country",countries:[c],horizon:"week",web:true}); }

  inp.addEventListener("blur",()=>setTimeout(tryAdd,220)); $("#fcAdd-list").addEventListener("mousedown",()=>setTimeout(tryAdd,0)); inp.addEventListener("keydown",e=>{ if(e.key==="Enter") setTimeout(tryAdd,0); });

async function fcRunReview(f){
  const m=$("#fvMsg"), b=$("#fvRev"); if(!sample){ m.textContent=t("aiOff"); return; }
  b.disabled=true; m.className="msg"; m.textContent=t("fcReviewing");
  try{
    const since=todayStr(new Date(f.createdAt)), {ctx}=fcContext(f.countries||[],since);
    const web=[]; if(mcp){ for(const c of (f.countries||[]).slice(0,3)){ try{ web.push({country:c,results:await fcWeb(c,f.title&&f.title.en||"",since)}); }catch(e){ if(e&&FATAL.has(e.code)) break; } } }
    const fc={title:f.title.en,bluf:f.bluf.en,scenarios:f.scenarios.map((s,i)=>({index:i,name:s.name.en||s.name.ar,description:s.desc.en||s.desc.ar,likelihood:s.likelihood,probability:s.prob})),indicators:f.indicators.map((x,i)=>({index:i,text:x.en||x.ar}))};
    const out=await sample.json(`You are a senior analyst at ACIS (Dubai Police). Today is ${todayStr()}. On ${since} the department made the forecast below for ${(f.countries||[]).map(c=>regionName(c,"en")).join(", ")}. Using ONLY the records and web results that follow, judge what actually happened since then.
Return ONLY JSON: {"verdict_en":"3-4 sentences on what happened compared with the forecast","verdict_ar":"the same in formal Modern Standard Arabic","accuracy":0-100,"outcomes":[{"index":0,"status":"happened|partly|not_yet|did_not","note_en":"one sentence of evidence","note_ar":"…"}],"indicators_seen":[indices of indicators that appeared]}
Give one outcome per scenario. Be strict: if there is no evidence, use "not_yet".
FORECAST: ${JSON.stringify(fc)}
RECORDS SINCE THEN: ${JSON.stringify(ctx).slice(0,50000)}
WEB RESULTS: ${web.length?web.map(w=>`[${w.country}] ${w.results}`).join("\n\n").slice(0,36000):"(none)"}`,{modelTier:fcTier(),cache:false});
    if(!out||typeof out!=="object") throw {code:"invalid_json"};
    const ST=["happened","partly","not_yet","did_not"];
    const review={at:Date.now(),accuracy:Math.max(0,Math.min(100,Math.round(+out.accuracy||0))),verdict:pair(out,"verdict"),
      outcomes:(Array.isArray(out.outcomes)?out.outcomes:[]).filter(o=>o&&Number.isInteger(o.index)&&o.index<f.scenarios.length).map(o=>({index:o.index,status:ST.includes(o.status)?o.status:"not_yet",note:pair(o,"note")})),
      seen:(Array.isArray(out.indicators_seen)?out.indicators_seen:[]).filter(i=>Number.isInteger(i)&&i<f.indicators.length)};
    const {id,...rest}=f; await db.collection("forecasts").doc(f.id).set({...rest,review});
    toast(t("saved")); openFc({...f,review});
  }catch(e){ console.warn(e); b.disabled=false; m.className="msg err"; m.textContent=e&&e.code&&e.code!=="invalid_json"?aiErr(e):t("fcReviewFail"); }
}

const DSTOP=new Set("the and for with from after over into amid says said near against between during their this that has have was were will its new قرب في من على إلى الى عن مع بعد خلال حول التي الذي ضد بين منذ عبر وسط".split(" "));
const dTok=s=>new Set(norm(s||"").replace(/[^\p{L}\p{N}\s]/gu," ").split(/\s+/).filter(w=>w.length>2&&!DSTOP.has(w)));
const dJac=(a,b)=>{ if(!a.size||!b.size) return 0; let i=0; a.forEach(x=>{ if(b.has(x)) i++; }); return i/(a.size+b.size-i); };
let dupDismiss=new Set();
function findDups(){
  const byC={}; news.forEach(n=>(byC[n.country] ||= []).push(n));
  const parent={}, f=x=>parent[x]===x?x:(parent[x]=f(parent[x]));
  for(const list of Object.values(byC)){ if(list.length<2) continue;
    const tk=list.map(n=>({n,en:dTok(n.headlineEn||(!hasAr(n.headline)?n.headline:"")),ar:dTok(n.headlineAr||(hasAr(n.headline)?n.headline:"")),d:Date.parse(n.date)||0}));
    for(let i=0;i<tk.length;i++) for(let j=i+1;j<tk.length;j++){ const a=tk[i], b=tk[j];
      if(Math.abs(a.d-b.d)>2*864e5) continue; if(Math.max(dJac(a.en,b.en),dJac(a.ar,b.ar))<0.45) continue;
      if(dupDismiss.has([a.n.id,b.n.id].sort().join("|"))) continue;
      if(parent[a.n.id]===undefined) parent[a.n.id]=a.n.id; if(parent[b.n.id]===undefined) parent[b.n.id]=b.n.id; parent[f(a.n.id)]=f(b.n.id); } }
  const g={}; Object.keys(parent).forEach(id=>(g[f(id)] ||= []).push(id));
  return Object.values(g).map(ids=>ids.map(id=>news.find(n=>n.id===id)).filter(Boolean)).filter(x=>x.length>1);
}

  for(const c of list){ const th=threats[c], w=th&&(th.level==="critical"||th.trend==="up")?2:1, sc=(now-(last[c]||0))*w; if(sc>bs){ bs=sc; best=c; } } return best; }
const mmss=ms=>{ const x=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(x/60)}:${String(x%60).padStart(2,"0")}`; };
const tHM=ms=>{ try{ return new Intl.DateTimeFormat(LOC(),{hour:"2-digit",minute:"2-digit"}).format(new Date(ms)); }catch(_){ return ""; } };
function renderWatch(){
  const b=$("#watchBtn"); if(b){ b.setAttribute("aria-pressed",String(watchOn)); const sp=b.querySelector("span"); if(sp) sp.textContent=t(watchOn?"watchOn":"watchOff"); }
  const ob=$("#opsBtn"); if(ob) ob.classList.toggle("watching",watchOn&&isOwner);
  const l=$("#watchLine"); if(!l) return;
  if(!isOwner||!watchOn){ l.textContent=""; return; }
  let x;
  if(watchErr) x=watchErr;
  else if(watchBusy) x=fill(t("watchChecking"),{c:regionName(watchBusy)});
  else if(document.hidden) x=t("watchPaused");
  else if(updRunning) x=t("updAuto");
  else { const c=watchPick(); x=c?fill(t("watchNext"),{c:regionName(c),s:mmss(watchNextAt-Date.now())}):t("watchNone"); }
  if(watchLastC&&!watchBusy) x+=" · "+fill(t("watchLast"),{c:regionName(watchLastC),t:tHM(watchLastAt)});
  l.textContent=x;
}
async function watchTick(){
  if(!watchOn||!isOwner||!db||!mcp||!sample||watchBusy||updRunning||liveBusy||fcBusy||document.hidden) return;
  if(Date.now()<watchNextAt) return;
  const c=watchPick(); if(!c){ watchNextAt=Date.now()+WATCH_MS; return; }
  let lease=null; try{ lease=await db.doc("meta/watch").acquire({holder:LIVE_SID,ttlMs:100000}); }catch(_){ lease=null; }
  if(lease&&lease.acquired===false){ watchNextAt=Date.now()+WATCH_MS; return; }   // another open screen is already watching
  watchBusy=c; watchErr=""; renderWatch();
  try{
    const r=await scanCountry(c,1,false,()=>{});
    wMark(c); watchLastC=c; watchLastAt=Date.now(); watchFails=0; watchNextAt=Date.now()+WATCH_MS;
    if(r.saved) toast(fill(t("watchFound"),{n:r.saved,c:regionName(c)}));
  }catch(e){
    console.warn(e); wMark(c); watchFails++;
    if(e&&FATAL.has(e.code)){ watchErr=liveErrMsg(e); watchNextAt=Date.now()+15*60000; }
    else watchNextAt=Date.now()+Math.min(15*60000,WATCH_MS*Math.pow(2,watchFails));   // slow down after errors, up to 15 minutes
  }finally{ watchBusy=false; renderWatch(); }
}
$("#watchBtn").onclick=()=>{ watchOn=!watchOn; store("acis.watch",watchOn?"1":"0"); watchErr=""; watchFails=0; watchNextAt=Date.now()+(watchOn?5000:WATCH_MS); renderWatch(); };
document.addEventListener("visibilitychange",renderWatch);
setInterval(()=>{ renderWatch(); watchTick(); },1000);

/* ---------- GitHub copy: read-only snapshot when the page runs outside Claude ---------- */
Object.assign(T.en,{snapNote:"Read-only copy saved on {d}. Live updates, AI features and saving work only inside Claude."});
Object.assign(T.ar,{snapNote:"نسخة للعرض فقط محفوظة بتاريخ {d}. التحديث المباشر وميزات الذكاء الاصطناعي والحفظ تعمل داخل Claude فقط."});

const ASSET_FILES={};
const assetUrl=id=>ASSET_FILES[id]||("assets/files/"+id);
/* Inside Claude files go through the platform's save dialog; elsewhere (GitHub Pages) a normal browser download. */
async function saveFile(name,data){
  if(downloads) return downloads.save({filename:name,data});
  const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
  return {status:"saved"};
}
async function loadSnapshot(){
  try{
    const r=await fetch("data/snapshot.json",{cache:"no-store"}); if(!r.ok) throw new Error("snapshot "+r.status);
    const S=await r.json();
    SNAP_MODE=true; SNAP_AT=+S.exportedAt||Date.now(); SNAP_PARTS=S.weekparts||{};

    threats=S.countries||{}; briefs=S.briefs||{}; weekDocs=S.weeks||{}; reviews=S.reviews||{};

    metaUpd=(S.meta&&S.meta.update)||null; isOwner=false; document.body.classList.remove("is-owner");
    status(fill(t("snapNote"),{d:fmtTs(SNAP_AT)}));
    renderAll();
  }catch(e){ console.warn(e); status(t("noDb")); renderAll(); }
}

/* ---------- Render / boot ---------- */
function renderAll(){ renderBoard(); renderFeed(); paintMap(); renderDubai(); renderAlerts(); renderOps(); renderUpd(); renderWeeks(); renderFcHome(); renderFcView(); renderWatch(); renderMorning(); renderDupBar(); renderSearch(); if(!$("#view-ask").hidden) renderAsk(); if(selected) renderCountry(); if(!$("#view-briefings").hidden&&!execEditing) renderBriefing(); else if(!$("#view-briefings").hidden){ renderReview(); } }
function status(m){ const s=$("#status"); if(m){ s.textContent=m; s.hidden=false; } else s.hidden=true; }

applyUi(); applyLang(); loadMap();
showView(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"countries");
(async()=>{
  if(!window.claude||!window.claude.use){ await loadSnapshot(); return; }
  status(t("connecting"));
  const [dbNs,uNs,aNs,dNs,sNs,mNs]=await Promise.all(["db","user","assets","downloads","sample","mcp"].map(n=>window.claude.use(n).catch(()=>null)));
  db=dbNs; userNs=uNs; assets=aNs; downloads=dNs; sample=sNs; mcp=mNs;
  if(sample){ try{ sampleLimits=await sample.limits(); }catch(_){ sampleLimits=null; } }
  if(userNs){ try{ isOwner=(await userNs.isOwner())||(await userNs.canEdit()); }catch(_){ isOwner=false; } try{ myId=await userNs.id(); }catch(_){ myId=null; } }
  else isOwner=true;
  document.body.classList.toggle("is-owner",isOwner);
  if(!db){ await loadSnapshot(); return; }
  const got={news:false,countries:false};
  const timer=setTimeout(()=>{ if(!got.news||!got.countries) status(t("offline")); },10000);
  const done=k=>{ got[k]=true; if(got.news&&got.countries){ clearTimeout(timer); status(""); } };
  const fail=()=>{ clearTimeout(timer); status(t("offline")); };
  db.collection("news").onSnapshot(s=>{ newsAll=s.docs.map(d=>({id:d.id,...d.data()})).filter(n=>n.country&&n.severity); news=newsAll.filter(n=>!n.mergedInto); if(!s.metadata.fromCache){ done("news"); newsLive=true; scheduleSync(); maybeAuto(); } renderAll(); },fail);
  db.collection("countries").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); threats=o; if(!s.metadata.fromCache){ done("countries"); countriesLive=true; maybeAuto(); } renderAll(); },fail);
  db.collection("briefs").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); briefs=o; if(!s.metadata.fromCache) briefsLive=true; renderMorning(); if(!$("#view-briefings").hidden&&!execEditing) renderExec(); },()=>{ briefsLive=true; });
  db.doc("meta/dups").onSnapshot(s=>{ const d=s.exists?s.data():null; dupDismiss=new Set(d&&Array.isArray(d.dismissed)?d.dismissed:[]); renderDupBar(); },()=>{});
  db.collection("reviews").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); reviews=o; if(!$("#view-briefings").hidden) renderReview(); },()=>{});
  db.doc("meta/update").onSnapshot(s=>{ metaUpd=s.exists?s.data():null; if(!s.metadata.fromCache){ metaLive=true; maybeAuto(); } renderUpd(); },()=>{ metaLive=true; maybeAuto(); });
  db.collection("forecasts").onSnapshot(s=>{ forecasts=s.docs.map(d=>({id:d.id,...d.data()})).filter(f=>f&&f.createdAt&&Array.isArray(f.scenarios)&&f.confidence&&f.dubai).sort((a,b)=>b.createdAt-a.createdAt); renderFcHome(); renderFcView(); renderOps(); if(selected) renderCfFc(selected); if(!$("#view-briefings").hidden&&!execEditing) renderBriefing(); },()=>{});
  db.collection("weeks").onSnapshot(s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); weekDocs=o; if(!s.metadata.fromCache){ weeksLive=true; scheduleSync(); } renderWeeks(); },()=>{ weeksLive=true; });
})();
})();
